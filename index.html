<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deutschlify – Nemis tilini o‘rganing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#14213d;--muted:#5b6478;--line:#d9d6cc;--gold:#f2b705;--red:#c8372d;--ok:#1f8a4c}
@media (prefers-color-scheme:dark){:root{--bg:#10151f;--card:#1a2233;--ink:#f1efe8;--muted:#9aa3b5;--line:#2c3650}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.55}
.stripe{height:8px;background:linear-gradient(#111 0 33%,var(--red) 33% 66%,var(--gold) 66%)}
header{max-width:760px;margin:0 auto;padding:28px 20px 8px}
h1{font-size:2.4rem;font-weight:800;margin:0;letter-spacing:-.02em}
header p{margin:4px 0 0;color:var(--muted)}
nav{max-width:760px;margin:16px auto 0;padding:0 20px;display:flex;gap:8px;flex-wrap:wrap}
nav button{flex:1;min-width:110px;padding:12px;border:2px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-weight:600;border-radius:10px;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg)}
main{max-width:760px;margin:0 auto;padding:20px}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.de{font-size:1.2rem;line-height:1.7}
.tr{color:var(--muted);margin-top:8px}
button.b,select,textarea,input[type=text]{font:inherit;color:var(--ink)}
button.b{background:var(--gold);color:#14213d;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
button.b.alt{background:transparent;border:2px solid var(--line);color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.q{margin-top:16px}.q p{font-weight:600;margin:0 0 8px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}
.opt.right{border-color:var(--ok);background:rgba(31,138,76,.15)}
.opt.wrong{border-color:var(--red);background:rgba(200,55,45,.15)}
textarea,input[type=text],select{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.row>*{flex:0 0 auto}.row select{flex:1}
.res{margin-top:12px;min-height:1.5em}
.good{color:var(--ok);font-weight:600}.bad{color:var(--red);font-weight:600}
small{color:var(--muted)}
body{padding-bottom:100px}
.page{display:none}.page.on{display:block}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -2px 14px rgba(0,0,0,.1);display:flex;justify-content:space-around;padding:12px 6px calc(10px + env(safe-area-inset-bottom))}
#bar button{background:none;border:0;color:var(--muted);font:inherit;font-size:.78rem;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;flex:1;padding:4px 0}
#bar svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#bar button.on{color:#e8793a}
.chat{display:flex;flex-direction:column;gap:8px;min-height:220px;max-height:50vh;overflow-y:auto;margin-bottom:12px}
.msg{padding:10px 14px;border-radius:14px;max-width:85%}
.msg.me{align-self:flex-end;background:var(--gold);color:#14213d}
.msg.bot{align-self:flex-start;background:var(--bg);border:1px solid var(--line)}
</style>
</head>
<body>
<div class="stripe"></div>
<header>
  <h1>Deutschlify</h1>
  <p>Nemis tilini o‘qing, tinglang va tarjima qiling.</p>
</header>
<div id="home" class="page on">
<nav id="tabs">
  <button data-t="lesen" class="on">📖 Lesen</button>
  <button data-t="horen">🎧 Hören</button>
  <button data-t="ai">🤖 AI Tarjimon</button>
</nav>
<main>

<!-- LESEN -->
<section id="lesen" class="on"></section>

<!-- HÖREN -->
<section id="horen">
  <div class="card">
    <p><b>Tinglang va eshitganingizni yozing.</b></p>
    <div class="row">
      <button class="b" id="play">▶ Tinglash</button>
      <button class="b alt" id="slow">🐢 Sekin</button>
      <button class="b alt" id="next">Keyingi gap</button>
    </div>
    <p class="tr" id="hcount"></p>
    <input type="text" id="dict" placeholder="Nemischa yozing..." autocomplete="off" autocapitalize="off">
    <div class="row"><button class="b" id="check">Tekshirish</button><button class="b alt" id="hint">Tarjimasi</button></div>
    <div class="res" id="hres"></div>
    <small id="novoice"></small>
  </div>
</section>

<!-- AI TRANSLATOR -->
<section id="ai">
  <div class="card">
    <textarea id="src" placeholder="Matnni kiriting..."></textarea>
    <div class="row">
      <select id="pair" aria-label="Til juftligi">
        <option value="de|uz">Nemischa → O‘zbekcha</option>
        <option value="uz|de">O‘zbekcha → Nemischa</option>
        <option value="de|en">Nemischa → Inglizcha</option>
        <option value="en|de">Inglizcha → Nemischa</option>
        <option value="de|ru">Nemischa → Ruscha</option>
        <option value="ru|de">Ruscha → Nemischa</option>
      </select>
      <button class="b" id="go">Tarjima qilish</button>
    </div>
    <div class="card" style="margin:14px 0 0"><div id="out" class="de">Tarjima shu yerda chiqadi.</div>
      <div class="row"><button class="b alt" id="spk">🔊 Nemischa o‘qish</button><button class="b alt" id="cp">Nusxa olish</button></div>
    </div>
  </div>
</section>

</main>
</div>

<div class="page" id="p-teacher"><main>
  <div class="card"><h3 style="margin-top:0">🤖 AI Lehrer(in)</h3>
    <div class="chat" id="chat"><div class="msg bot">Hallo! Men sizning o‘qituvchingizman. O‘zbekcha gap yozing, men nemischasini aytaman.</div></div>
    <div class="row"><input type="text" id="cin" placeholder="Xabar yozing..." style="flex:1" autocomplete="off"><button class="b" id="csend">Yuborish</button></div>
  </div>
</main></div>

<div class="page" id="p-sprechen"><main>
  <div class="card"><h3 style="margin-top:0">🎤 Sprechen</h3>
    <div class="de" id="pde"></div><div class="tr" id="puz"></div>
    <div class="row"><button class="b alt" id="pplay">🔊 Tinglash</button><button class="b" id="pmic">🎤 Gapirish</button><button class="b alt" id="pnext">Keyingi</button></div>
    <div class="res" id="pres"></div>
  </div>
</main></div>

<div class="page" id="p-mock"><main>
  <div class="card"><h3 style="margin-top:0">📝 Mock test</h3><div id="mbox"></div></div>
</main></div>

<div class="page" id="p-profil"><main>
  <div class="card"><h3 style="margin-top:0">👤 Profil</h3>
    <input type="text" id="pname" placeholder="Ismingiz" autocomplete="off">
    <div class="res" id="pstats"></div>
  </div>
</main></div>

<div id="bar" role="navigation">
  <button class="on" data-p="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M9 16h6"/></svg>Bosh sahifa</button>
  <button data-p="p-teacher"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4l1.8 5.2L17 11l-5.2 1.8L10 18l-1.8-5.2L3 11l5.2-1.8z"/><path d="M18 3v4M16 5h4"/></svg>AI Lehrer(in)</button>
  <button data-p="p-sprechen"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Sprechen</button>
  <button data-p="p-mock"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M9 14l2 2 4-4"/></svg>Mock</button>
  <button data-p="p-profil"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18.5a6 6 0 0 1 11 0"/></svg>Profil</button>
</div>
<script>
/* ---------- Tabs ---------- */
const tabs=document.querySelectorAll('#tabs button');
tabs.forEach(b=>b.onclick=()=>{
  tabs.forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('#home section').forEach(s=>s.classList.toggle('on',s.id===b.dataset.t));
});

/* ---------- Speech helper ---------- */
function speak(text,rate=1){
  if(!('speechSynthesis' in window)){document.getElementById('novoice').textContent='Brauzeringiz ovozni qo‘llamaydi.';return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='de-DE';u.rate=rate;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('de'));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}

/* ---------- LESEN ---------- */
const texts=[
 {title:'Anna stellt sich vor',de:'Hallo! Ich heiße Anna. Ich komme aus Berlin. Ich bin 25 Jahre alt. Ich lerne Spanisch und Englisch. Am Wochenende spiele ich Fußball.',
  uz:'Salom! Mening ismim Anna. Men Berlindanman. Men 25 yoshdaman. Men ispan va ingliz tillarini o‘rganaman. Dam olish kunlari futbol o‘ynayman.',
  qs:[{q:'Woher kommt Anna?',o:['Berlin','Wien','Zürich'],a:0},{q:'Wie alt ist Anna?',o:['22','25','30'],a:1},{q:'Was macht Anna am Wochenende?',o:['Sie lernt','Sie spielt Fußball','Sie arbeitet'],a:1}]},
 {title:'Meine Familie',de:'Das ist meine Familie. Mein Vater heißt Karl und meine Mutter heißt Eva. Ich habe eine Schwester. Sie heißt Lisa. Wir wohnen in einem Haus in München.',
  uz:'Bu mening oilam. Dadamning ismi Karl, onamning ismi Eva. Mening bitta singlim bor. Uning ismi Lisa. Biz Myunxendagi uyda yashaymiz.',
  qs:[{q:'Wie heißt die Mutter?',o:['Lisa','Eva','Anna'],a:1},{q:'Wo wohnt die Familie?',o:['In München','In Berlin','In Hamburg'],a:0}]},
 {title:'Im Café',de:'Heute gehe ich ins Café. Ich bestelle einen Kaffee und ein Stück Kuchen. Der Kaffee kostet drei Euro. Der Kuchen kostet vier Euro. Ich bezahle sieben Euro.',
  uz:'Bugun men kafega boraman. Men qahva va bir bo‘lak tort buyurtma qilaman. Qahva uch yevro. Tort to‘rt yevro. Men yetti yevro to‘layman.',
  qs:[{q:'Was kostet der Kaffee?',o:['3 Euro','4 Euro','7 Euro'],a:0},{q:'Wie viel bezahlt die Person insgesamt?',o:['5 Euro','7 Euro','9 Euro'],a:1}]}
];
const lesen=document.getElementById('lesen');
texts.forEach((t,i)=>{
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<h3 style="margin-top:0">${t.title}</h3><div class="de">${t.de}</div>
  <div class="row"><button class="b alt" data-a="spk">🔊 Tinglash</button><button class="b alt" data-a="tr">Tarjimasi</button></div>
  <div class="tr" hidden>${t.uz}</div>`;
  const tr=c.querySelector('.tr');
  c.querySelector('[data-a=spk]').onclick=()=>speak(t.de,.9);
  c.querySelector('[data-a=tr]').onclick=()=>tr.hidden=!tr.hidden;
  t.qs.forEach(q=>{
    const d=document.createElement('div');d.className='q';
    d.innerHTML=`<p>${q.q}</p>`;
    q.o.forEach((o,k)=>{
      const b=document.createElement('button');b.className='opt';b.textContent=o;
      b.onclick=()=>{
        d.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(j===q.a)x.classList.add('right')});
        if(k!==q.a)b.classList.add('wrong');
      };
      d.appendChild(b);
    });
    c.appendChild(d);
  });
  lesen.appendChild(c);
});

/* ---------- HÖREN ---------- */
const sents=[
 ['Guten Morgen, wie geht es Ihnen?','Xayrli tong, ahvollaringiz qanday?'],
 ['Ich möchte einen Kaffee, bitte.','Menga bitta qahva bering, iltimos.'],
 ['Wo ist der Bahnhof?','Vokzal qayerda?'],
 ['Ich wohne seit zwei Jahren in Hamburg.','Men ikki yildan beri Gamburgda yashayman.'],
 ['Das Wetter ist heute sehr schön.','Bugun ob-havo juda yaxshi.']
];
let si=0;
const $=id=>document.getElementById(id);
const norm=s=>s.toLowerCase().replace(/[.,!?;:]/g,'').replace(/\s+/g,' ').trim();
function showS(){$('hcount').textContent=`Gap ${si+1} / ${sents.length}`;$('dict').value='';$('hres').textContent=''}
$('play').onclick=()=>speak(sents[si][0],1);
$('slow').onclick=()=>speak(sents[si][0],.55);
$('next').onclick=()=>{si=(si+1)%sents.length;showS()};
$('hint').onclick=()=>$('hres').textContent='🇺🇿 '+sents[si][1];
$('check').onclick=()=>{
  const ok=norm($('dict').value)===norm(sents[si][0]);
  $('hres').innerHTML=ok?'<span class="good">✔ To‘g‘ri!</span>':`<span class="bad">✘ Noto‘g‘ri.</span> To‘g‘risi: <b>${sents[si][0]}</b>`;
};
$('dict').addEventListener('keydown',e=>{if(e.key==='Enter')$('check').click()});
showS();

/* ---------- AI TRANSLATOR (MyMemory, kalitsiz) ---------- */
$('go').onclick=async()=>{
  const q=$('src').value.trim();if(!q)return;
  $('out').textContent='Tarjima qilinmoqda...';
  try{
    const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair='+$('pair').value);
    const d=await r.json();
    $('out').textContent=d.responseData.translatedText||'Tarjima topilmadi.';
  }catch(e){$('out').textContent='Xatolik: internetni tekshiring va qayta urining.'}
};
$('spk').onclick=()=>{
  const lang=$('pair').value.split('|')[1];
  const text=lang==='de'?$('out').textContent:$('src').value;
  speak(text,.9);
};
$('cp').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText($('out').textContent);
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{};

/* ---------- Pastki panel ---------- */
const store={get(k,d){try{const v=localStorage.getItem('dl_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('dl_'+k,JSON.stringify(v))}catch(e){}}};
const bar=document.querySelectorAll('#bar button');
bar.forEach(b=>b.onclick=()=>{
  bar.forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===b.dataset.p||(b.dataset.p==='home'&&p.id==='home')));
  if(b.dataset.p==='p-profil')stats();
  scrollTo(0,0);
});

/* ---------- AI Lehrer(in) ---------- */
const API_URL=''; // Backend manzilingiz (POST {message} -> {reply}). Bo‘sh bo‘lsa oddiy tarjima ishlaydi.
function addMsg(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;$('chat').appendChild(d);$('chat').scrollTop=1e9;return d}
async function askTeacher(text){
  if(API_URL){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});return (await r.json()).reply}
  const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=uz|de');
  const d=await r.json();return 'Auf Deutsch: '+d.responseData.translatedText;
}
$('csend').onclick=async()=>{
  const t=$('cin').value.trim();if(!t)return;
  $('cin').value='';addMsg(t,'me');const w=addMsg('...','bot');
  try{w.textContent=await askTeacher(t)}catch(e){w.textContent='Xatolik, qayta urinib ko‘ring.'}
};
$('cin').addEventListener('keydown',e=>{if(e.key==='Enter')$('csend').click()});

/* ---------- Sprechen ---------- */
const phr=[['Ich heiße Anna.','Mening ismim Anna.'],['Wie geht es dir?','Ahvoling qalay?'],['Ich komme aus Usbekistan.','Men O‘zbekistondanman.'],['Ich lerne Deutsch.','Men nemis tilini o‘rganaman.'],['Können Sie mir helfen?','Menga yordam bera olasizmi?']];
let pi=0;
function showP(){$('pde').textContent=phr[pi][0];$('puz').textContent=phr[pi][1];$('pres').textContent='';$('pres').className='res'}
$('pplay').onclick=()=>speak(phr[pi][0],.9);
$('pnext').onclick=()=>{pi=(pi+1)%phr.length;showP()};
$('pmic').onclick=()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){$('pres').textContent='Brauzeringiz mikrofonni tanimaydi. Chrome yoki Edge’dan foydalaning.';return}
  const r=new SR();r.lang='de-DE';
  r.onresult=e=>{
    const heard=e.results[0][0].transcript;
    const a=norm(heard).split(' '),b=norm(phr[pi][0]).split(' ');
    const pct=Math.round(b.filter(w=>a.includes(w)).length/b.length*100);
    $('pres').textContent='Eshitildi: '+heard+' (aniqlik '+pct+'%)';
    $('pres').className='res '+(pct>=80?'good':'bad');
    const s=store.get('spk',{n:0,ok:0});s.n++;if(pct>=80)s.ok++;store.set('spk',s);
  };
  r.onerror=()=>{$('pres').textContent='Mikrofonga ruxsat bering va qayta urining.'};
  r.start();$('pres').className='res';$('pres').textContent='Tinglayapman...';
};
showP();

/* ---------- Mock test ---------- */
const mq=[
 ['Ich ___ Anna.',['bin','heiße','habe'],1],
 ['Er ___ aus Berlin.',['komme','kommt','kommst'],1],
 ['Wir ___ Deutsch.',['lernen','lernt','lerne'],0],
 ['___ Mutter ist nett.',['Der','Die','Das'],1],
 ['Ich habe ___ Bruder.',['eine','einen','ein'],1],
 ['Danke! – ___',['Bitte','Hallo','Tschüss'],0]
];
let mi=0,ms=0;
function mockShow(){
  const box=$('mbox');box.innerHTML='';
  if(mi>=mq.length){
    store.set('best',Math.max(store.get('best',0),ms));
    const h=document.createElement('h3');h.textContent='Natija: '+ms+' / '+mq.length;
    const b=document.createElement('button');b.className='b';b.textContent='Qayta boshlash';
    b.onclick=()=>{mi=0;ms=0;mockShow()};
    box.append(h,b);return;
  }
  const [q,o,a]=mq[mi];
  const p=document.createElement('p');p.className='de';p.textContent=(mi+1)+'/'+mq.length+'  '+q;box.appendChild(p);
  o.forEach((t,k)=>{
    const b=document.createElement('button');b.className='opt';b.textContent=t;
    b.onclick=()=>{
      box.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(j===a)x.classList.add('right')});
      if(k===a)ms++;else b.classList.add('wrong');
      setTimeout(()=>{mi++;mockShow()},900);
    };
    box.appendChild(b);
  });
}
mockShow();

/* ---------- Profil ---------- */
$('pname').value=store.get('name','');
$('pname').oninput=e=>store.set('name',e.target.value);
function stats(){
  const s=store.get('spk',{n:0,ok:0});
  $('pstats').innerHTML='Mock: eng yaxshi natija '+store.get('best',0)+' / '+mq.length+'<br>Sprechen: '+s.ok+' / '+s.n+' to‘g‘ri';
}
stats();
</script>
</body>
</html>
